services:
  - type: web
    name: remote-audio-link
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ROOM_PIN
        sync: false
      - key: MAX_ROOM_SIZE
        value: 12
      - key: MAX_ROOMS
        value: 100
